server {
    listen      80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compress text. Images are already JPEG/PNG and gain nothing from gzip.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Assets are not content-hashed, so a long immutable cache would strand
    # visitors on a stale logo or hero image after an update. A week is long
    # enough to matter for repeat visits and short enough to self-heal.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # index.html and support.js must revalidate, so a redeploy is visible
    # immediately instead of after a cache expiry.
    location ~* \.(?:html|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # This is a single page with anchor navigation, not a client-side router.
    # An unknown path is genuinely missing, so let it 404 rather than serving
    # index.html and reporting 200 for a URL that does not exist - that would
    # have search engines index duplicates of the home page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Keep nginx's own version out of responses.
    server_tokens off;
}
