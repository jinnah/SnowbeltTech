# Shared response headers.
#
# nginx's add_header does NOT inherit into a location block that declares its
# own add_header - the child set replaces the parent set entirely. That is why
# this file is included in every location that sets Cache-Control rather than
# being declared once at server level.
#
# No Content-Security-Policy here on purpose: the page is built from inline
# style attributes and an inline script, so any CSP would need both
# 'unsafe-inline' for styles and 'unsafe-inline' for scripts, which buys
# almost nothing. Add a real CSP only if the markup moves to external files.

add_header X-Content-Type-Options "nosniff"                        always;
add_header X-Frame-Options        "SAMEORIGIN"                     always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
