# Snowbelt Tech - static site behind nginx.
#
#   docker compose up -d --build      start (or restart after a git pull)
#   docker compose logs -f            follow logs
#   docker compose down               stop and remove
#
# HTTP_PORT controls the host port. It defaults to 8080 so a first run cannot
# collide with anything already listening on 80 on the VPS. To serve the site
# directly on port 80:
#
#   echo "HTTP_PORT=80" > .env && docker compose up -d
#
# See README ("Hosting") before pointing a domain here - this container speaks
# plain HTTP only and needs something in front of it for TLS.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: snowbelt-tech-site:latest
    container_name: snowbelt-tech-site
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    # Cap the log files. A small VPS should not fill its disk with access logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
